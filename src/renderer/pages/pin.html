<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline';">
<title>SecureExam – Login</title>
<link rel="stylesheet" href="../styles/global.css"/>
<style>
:root {
  --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
  --glass: rgba(255, 255, 255, 0.03);
  --glass-border: rgba(255, 255, 255, 0.08);
}

.login-card {
  width: min(480px, 95%);
  padding: 48px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 32px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.4);
  position: relative;
  overflow: hidden;
}

.login-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 6px;
  background: var(--accent-gradient);
}

.shield-icon {
  width: 64px; height: 64px;
  background: var(--accent-gradient);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  margin: 0 auto 32px;
  box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

h1 { font-size: 28px; font-weight: 800; text-align: center; margin-bottom: 12px; letter-spacing: -0.5px; }
.subtitle { color: var(--text2); text-align: center; margin-bottom: 40px; font-size: 15px; }

.pin-inputs {
  display: flex; gap: 10px; justify-content: center;
  margin-bottom: 32px;
}
.pin-box {
  width: 52px; height: 64px;
  background: var(--surface2);
  border: 2px solid var(--border);
  border-radius: 14px;
  text-align: center;
  font-family: var(--mono);
  font-size: 24px; font-weight: 700;
  color: var(--text);
  outline: none;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.pin-box:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
  transform: translateY(-2px);
  background: var(--surface);
}
.pin-box.filled { border-color: var(--accent); background: var(--surface); }
.pin-box.error { border-color: #ef4743; animation: shake 0.4s; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.btn-primary {
  height: 56px; border-radius: 16px;
  font-size: 16px; font-weight: 700;
  background: var(--accent-gradient);
  border: none;
  box-shadow: 0 12px 24px rgba(99, 102, 241, 0.3);
  margin-bottom: 24px;
}
.btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 16px 32px rgba(99, 102, 241, 0.4); }

.security-badge {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  color: var(--text2); font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 1px;
}
.security-badge span { font-size: 16px; color: #22d3a0; }

.loading-overlay {
  position: fixed; inset: 0;
  background: rgba(10, 12, 18, 0.9);
  backdrop-filter: blur(12px);
  display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 24px;
  z-index: 1000;
}
.loading-overlay.show { display: flex; }
.spinner-ring {
  width: 64px; height: 64px;
  border: 4px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.theme-toggle {
  position: fixed; top: 24px; right: 24px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 100px; padding: 10px 20px;
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; font-size: 13px; color: var(--text2);
  transition: all 0.3s;
}
.theme-toggle:hover { border-color: var(--accent); transform: scale(1.05); }
.toggle-track { width: 32px; height: 18px; background: var(--border); border-radius: 100px; position: relative; }
.toggle-track.on { background: var(--accent); }
.toggle-thumb { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: transform 0.3s; }
.toggle-track.on .toggle-thumb { transform: translateX(14px); }
</style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()">
  <span id="themeIcon">☀️</span>
  <div class="toggle-track" id="track"><div class="toggle-thumb"></div></div>
  <span id="themeLabel">Light</span>
</button>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner-ring"></div>
  <div style="font-size:16px;font-weight:700;letter-spacing:1px;color:var(--text)" id="loadingText">SECURE AUTHORIZATION...</div>
</div>

<div class="page">
  <div class="login-card fade-in">
    <div class="shield-icon">🛡️</div>
    <h1>Welcome to SecureExam</h1>
    <p class="subtitle">Enter your 6-digit access PIN to authorize this session.</p>

    <div class="pin-inputs" id="pinInputs">
      <input class="pin-box" type="password" maxlength="1" inputmode="numeric" id="p0" autocomplete="off"/>
      <input class="pin-box" type="password" maxlength="1" inputmode="numeric" id="p1" autocomplete="off"/>
      <input class="pin-box" type="password" maxlength="1" inputmode="numeric" id="p2" autocomplete="off"/>
      <input class="pin-box" type="password" maxlength="1" inputmode="numeric" id="p3" autocomplete="off"/>
      <input class="pin-box" type="password" maxlength="1" inputmode="numeric" id="p4" autocomplete="off"/>
      <input class="pin-box" type="password" maxlength="1" inputmode="numeric" id="p5" autocomplete="off"/>
    </div>

    <button class="btn btn-primary" id="submitBtn" onclick="submitPin()" disabled>
      Verify Authorization
    </button>

    <div class="error-msg" id="errMsg" style="text-align:center;margin-top:-10px;margin-bottom:20px;font-size:13px;color:#ef4743;display:none">
      Invalid PIN. Please re-enter credentials.
    </div>

    <div class="security-badge">
      <span>🛡️</span>
      ESTABLISHING SECURE GATEWAY
    </div>
  </div>
</div>

<script>
// ── Theme ──────────────────────────────────────────────────────
let isDark = localStorage.getItem('theme') !== 'light';
function toggleTheme() {
  isDark = !isDark; applyTheme();
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
function applyTheme() {
  const r = document.documentElement;
  if (!isDark) {
    r.style.setProperty('--bg','#f0f2f8'); r.style.setProperty('--surface','#ffffff');
    r.style.setProperty('--surface2','#f5f7ff'); r.style.setProperty('--border','#dde1f0');
    r.style.setProperty('--text','#1a1e2e'); r.style.setProperty('--text2','#5a6080');
  } else {
    r.style.setProperty('--bg','#0a0c12'); r.style.setProperty('--surface','#111520');
    r.style.setProperty('--surface2','#181e2e'); r.style.setProperty('--border','#232a3e');
    r.style.setProperty('--text','#e8eaf6'); r.style.setProperty('--text2','#8892b0');
  }
  document.getElementById('track').className = 'toggle-track' + (!isDark ? ' on' : '');
  document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
  document.getElementById('themeLabel').textContent = isDark ? 'Light' : 'Dark';
}

// ── Logic ──────────────────────────────────────────────────────
const boxes = Array.from({length:6}, (_,i) => document.getElementById('p'+i));

boxes.forEach((box, idx) => {
  box.addEventListener('input', e => {
    const val = e.target.value.replace(/\D/g,'');
    box.value = val;
    if (val) {
      box.classList.add('filled');
      if (idx < 5) boxes[idx+1].focus();
    }
    checkComplete();
  });
  box.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !box.value && idx > 0) {
      boxes[idx-1].focus();
      boxes[idx-1].value = '';
      boxes[idx-1].classList.remove('filled');
      checkComplete();
    }
    if (e.key === 'Enter') submitPin();
  });
});

function checkComplete() {
  document.getElementById('submitBtn').disabled = !boxes.every(b => b.value.length === 1);
}

function showError(msg) {
  const err = document.getElementById('errMsg');
  err.textContent = msg; err.style.display = 'block';
  boxes.forEach(b => { b.classList.add('error'); b.value = ''; b.classList.remove('filled'); });
  setTimeout(() => boxes.forEach(b => b.classList.remove('error')), 500);
  boxes[0].focus();
}

async function submitPin() {
  const pin = boxes.map(b => b.value).join('');
  if (pin.length !== 6) return;

  document.getElementById('loadingOverlay').classList.add('show');
  document.getElementById('errMsg').style.display = 'none';

  try {
    const res = await window.examAPI.validatePin(pin);
    if (res && res.success && res.data) {
      await window.examAPI.setSession('student', res.data.student);
      await window.examAPI.setSession('pin', pin);
      
      let schedule = res.data.schedule;
      if (!schedule) {
        const schedRes = await window.examAPI.fetchExamSchedule(pin);
        schedule = schedRes.success ? schedRes.data : null;
      }
      await window.examAPI.setSession('schedule', schedule);
      
      await new Promise(r => setTimeout(r, 800));
      await window.examAPI.navigate('confirmation');
    } else {
      document.getElementById('loadingOverlay').classList.remove('show');
      showError(res?.message || 'Invalid Access PIN');
    }
  } catch (err) {
    document.getElementById('loadingOverlay').classList.remove('show');
    showError('Authorization Gateway Error');
  }
}

applyTheme();
boxes[0].focus();
</script>
</body>
</html>
