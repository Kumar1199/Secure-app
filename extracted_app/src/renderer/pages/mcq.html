<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline';">
<title>SecureExam – MCQ</title>
<link rel="stylesheet" href="../styles/global.css"/>
<style>
html,body { overflow: hidden; width: 100%; height: 100%; margin: 0; padding: 0; }

/* ── Layout ── */
.exam-layout {
  display: grid;
  grid-template-rows: 56px 1fr;
  grid-template-columns: 1fr minmax(250px, 300px);
  width: 100%;
  height: 100%;
  background: var(--bg);
  margin: 0;
  padding: 0;
}

/* ── Top Bar ── */
.topbar {
  grid-column: 1 / -1;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 10;
}
.topbar-left  { display:flex; align-items:center; gap:16px; }
.topbar-right { display:flex; align-items:center; gap:16px; }
.exam-title   { font-size:15px; font-weight:700; }
.exam-meta    { font-size:12px; color:var(--text2); }

.timer-box {
  display:flex; align-items:center; gap:8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 14px;
}
.timer-label { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text2); }
.timer-val { font-family:var(--mono); font-size:18px; font-weight:700; color:var(--accent); }
.timer-val.warn { color:var(--warning); }
.timer-val.crit { color:var(--danger); animation:pulse 1s infinite; }

.progress-text { font-size:13px; color:var(--text2); }
.progress-bar-wrap { width:120px; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
.progress-bar-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:3px; transition:width 0.4s; }

/* ── Question Panel ── */
.question-panel {
  padding: 32px 40px;
  overflow-y: auto;
  display: flex; flex-direction: column;
}
.q-number { font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text2); margin-bottom:12px; font-weight:600; }
.q-text {
  font-size:22px; font-weight:700; line-height:1.8;
  margin-bottom:36px; color:var(--text);
}
.options { display:flex; flex-direction:column; gap:12px; }
.option {
  display:flex; align-items:center; gap:18px;
  padding: 18px 22px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.18s;
  font-size: 16px;
}
.option:hover { border-color: var(--accent); background: rgba(79,142,247,0.06); }
.option.selected {
  border-color: var(--accent);
  background: rgba(79,142,247,0.12);
  color: var(--accent);
}
.option-letter {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--surface2);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono);
  font-size: 15px; font-weight: 700;
  flex-shrink: 0;
  transition: all 0.18s;
}
.option.selected .option-letter {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.nav-btns {
  display:flex; gap:12px; margin-top: auto; padding-top: 32px;
}
.nav-btns .btn { width: auto; padding: 12px 24px; }

/* ── Side Panel ── */
.side-panel {
  border-left: 1px solid var(--border);
  background: var(--surface);
  overflow-y: auto;
  padding: 20px 16px;
}
.side-title { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--text2); margin-bottom:16px; font-weight:600; }

.q-grid {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 8px; margin-bottom: 24px;
}
.q-dot {
  aspect-ratio: 1;
  border-radius: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; cursor: pointer;
  transition: all 0.15s;
  color: var(--text2);
}
.q-dot:hover   { border-color: var(--accent); }
.q-dot.current { border-color: var(--accent); color: var(--accent); }
.q-dot.answered { background: rgba(34,211,160,0.15); border-color: var(--success); color: var(--success); }
.q-dot.current.answered { background: rgba(79,142,247,0.2); border-color: var(--accent); color: var(--accent); }

.legend { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
.legend-item { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text2); }
.legend-dot { width:12px; height:12px; border-radius:3px; }

.submit-section { margin-top: 24px; }
.answered-count { font-size:13px; color:var(--text2); text-align:center; margin-bottom:12px; }
.answered-count strong { color:var(--success); }

/* Theme toggle in topbar */
.tt-mini {
  display:flex; align-items:center; gap:6px;
  cursor:pointer; font-size:12px; color:var(--text2);
}
.tt-mini .toggle-track { width:30px; height:16px; }
.tt-mini .toggle-thumb { width:12px; height:12px; }
.tt-mini .toggle-track.on .toggle-thumb { transform:translateX(14px); }
</style>
</head>
<body oncontextmenu="return false">

<div class="exam-layout">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo-icon" style="width:32px;height:32px;font-size:16px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;">🛡️</div>
      <div>
        <div class="exam-title" id="examTitle">MCQ Examination</div>
        <div class="exam-meta" id="examMeta">Loading...</div>
      </div>
    </div>
    <div class="topbar-right">
      <div>
        <div class="progress-text" id="progText">0 / 0 answered</div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progBar" style="width:0%"></div></div>
      </div>
      <div class="timer-box">
        <div class="timer-label">⏱ Time Left</div>
        <div class="timer-val" id="timerVal">00:00:00</div>
      </div>
      <div class="tt-mini" onclick="toggleTheme()">
        <span id="themeIcon">☀️</span>
        <div class="toggle-track" id="track"><div class="toggle-thumb"></div></div>
      </div>
    </div>
  </div>

  <!-- Question Panel -->
  <div class="question-panel" id="qPanel">
    <div class="q-number" id="qNum">Question 1 of 10</div>
    <div class="q-text" id="qText">Loading question...</div>
    <div class="options" id="optList"></div>
    <div class="nav-btns">
      <button class="btn btn-ghost" id="prevBtn" onclick="prevQ()">← Previous</button>
      <button class="btn btn-primary" id="nextBtn" onclick="stepNext()">Next →</button>
    </div>
  </div>

  <!-- Side Panel -->
  <div class="side-panel">
    <div class="side-title">Question Navigator</div>
    <div class="q-grid" id="qGrid"></div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--surface2);border:1px solid var(--border)"></div>Not visited</div>
      <div class="legend-item"><div class="legend-dot" style="background:rgba(34,211,160,0.15);border:1px solid var(--success)"></div>Answered</div>
      <div class="legend-item"><div class="legend-dot" style="background:rgba(79,142,247,0.2);border:1px solid var(--accent)"></div>Current</div>
    </div>

    <div class="divider"></div>

    <div class="submit-section">
      <div class="answered-count" id="ansCount"><strong>0</strong> of <strong>0</strong> answered</div>
      <button class="btn btn-ghost" onclick="showReview()">📝 Review Answers</button>
      <button class="btn btn-success" onclick="confirmSubmit()">✅ Submit Exam</button>
    </div>
  </div>
</div>

<!-- Review overlay -->
<div id="reviewOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);z-index:998;align-items:center;justify-content:center;padding:20px;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px;max-width:720px;width:100%;max-height:85vh;overflow:auto;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;">
      <div>
        <div style="font-size:18px;font-weight:700;color:var(--text);">Review Your Answers</div>
        <div style="font-size:13px;color:var(--text2);margin-top:6px;" id="reviewCounts">Answered 0 of 0 • 0 unanswered</div>
      </div>
      <button class="btn btn-ghost" style="padding:10px 16px;" onclick="closeReview()">Close</button>
    </div>
    <div id="reviewList" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:24px;"></div>
    <div style="display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;">
      <button class="btn btn-ghost" onclick="closeReview()">Continue Exam</button>
      <button class="btn btn-success" onclick="doSubmit()">Submit Exam</button>
    </div>
  </div>
</div>

<!-- Confirm modal -->
<div id="submitModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:999;align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px;width:420px;text-align:center;">
    <div style="font-size:48px;margin-bottom:16px;">📋</div>
    <h2>Submit Exam?</h2>
    <p style="margin:12px 0 24px;color:var(--text2);" id="submitMsg">You have answered 0 of 0 questions.</p>
    <div style="display:flex;gap:12px;">
      <button class="btn btn-ghost" onclick="closeModal()">← Keep Going</button>
      <button class="btn btn-success" onclick="doSubmit()">✅ Submit Now</button>
    </div>
  </div>
</div>

<script>
let questions   = [];
let answers     = [];
let currentIdx  = 0;
let examEndTime = null;
let timerInterval = null;
let student     = null;
let schedule    = null;

// ── Theme ─────────────────────────────────────────────────────
let isDark = localStorage.getItem('theme') !== 'light';
function toggleTheme() {
  isDark = !isDark;
  applyTheme();
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
function applyTheme() {
  const r = document.documentElement;
  if (!isDark) {
    r.style.setProperty('--bg','#f0f2f8'); r.style.setProperty('--surface','#ffffff');
    r.style.setProperty('--surface2','#f5f7ff'); r.style.setProperty('--border','#dde1f0');
    r.style.setProperty('--text','#1a1e2e'); r.style.setProperty('--text2','#5a6080');
  } else {
    r.style.setProperty('--bg','#0a0c12'); r.style.setProperty('--surface','#111520');
    r.style.setProperty('--surface2','#181e2e'); r.style.setProperty('--border','#232a3e');
    r.style.setProperty('--text','#e8eaf6'); r.style.setProperty('--text2','#8892b0');
  }
  document.getElementById('track').className = 'toggle-track' + (!isDark ? ' on' : '');
  document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
}

// ── Block all keyboard shortcuts in exam ──────────────────────
document.addEventListener('keydown', e => {
  const allowed = ['ArrowLeft','ArrowRight','Tab','Enter','Space'];
  if (e.ctrlKey || e.metaKey || e.altKey || e.key === 'Meta' || e.key === 'Win') {
    e.preventDefault(); e.stopPropagation(); return false;
  }
}, true);
document.addEventListener('contextmenu', e => e.preventDefault());

// ── Init ──────────────────────────────────────────────────────
async function init() {
  applyTheme();
  student = await window.examAPI.getSession('student');
  schedule = await window.examAPI.getSession('schedule');
  const qData    = await window.examAPI.getSession('questions');

  if (!student) { window.examAPI.navigate('pin'); return; }

  // Handle questions: may be stored directly or nested
  if (qData) {
    questions = qData.questions || qData || [];
  }

  // Fallback: generate mock questions if none loaded
  if (!questions || questions.length === 0) {
    questions = generateMockQuestions(student.subject || 'General', student.difficulty || 'medium');
  }

  answers = new Array(questions.length).fill(null);

  document.getElementById('examTitle').textContent = `MCQ – ${student.subject || 'Examination'}`;
  document.getElementById('examMeta').textContent  = `${student.rollNumber} · ${capitalize(student.difficulty)} · ${questions.length} Questions`;

  // Fix timer: use schedule endTime if valid and in the future, else use duration
  const duration = student.duration || 3600; // seconds, default 1hr
  if (schedule?.endTime) {
    const end = new Date(schedule.endTime);
    // If endTime is in the past or too close, recalculate from now
    if (end.getTime() > Date.now() + 10000) {
      examEndTime = end;
    } else {
      examEndTime = new Date(Date.now() + duration * 1000);
    }
  } else {
    examEndTime = new Date(Date.now() + duration * 1000);
  }

  buildGrid();
  renderQuestion(0);
  startTimer();
}

function generateMockQuestions(subject, difficulty) {
  return [
    { id:1, question:`Which data structure uses LIFO order?`, options:['Queue','Stack','Linked List','Tree'], correct:1 },
    { id:2, question:`What is the time complexity of binary search?`, options:['O(n)','O(n²)','O(log n)','O(1)'], correct:2 },
    { id:3, question:`Which sorting algorithm has best average case O(n log n)?`, options:['Bubble Sort','Selection Sort','Merge Sort','Insertion Sort'], correct:2 },
    { id:4, question:`What does RAM stand for?`, options:['Random Access Memory','Read Access Module','Runtime Application Memory','Register Array Memory'], correct:0 },
    { id:5, question:`Which traversal visits root first in a BST?`, options:['Inorder','Postorder','Preorder','Level order'], correct:2 },
    { id:6, question:`What is the worst case of Quick Sort?`, options:['O(n log n)','O(n)','O(n²)','O(log n)'], correct:2 },
    { id:7, question:`A queue follows which principle?`, options:['LIFO','FIFO','LILO','FILO'], correct:1 },
    { id:8, question:`Which is NOT a linear data structure?`, options:['Array','Linked List','Queue','Tree'], correct:3 },
    { id:9, question:`Dijkstra's algorithm is used for?`, options:['Sorting','Shortest path','Minimum spanning tree','String matching'], correct:1 },
    { id:10, question:`Big O notation describes?`, options:['Exact runtime','Best case','Upper bound on runtime','Memory usage'], correct:2 },
  ];
}

function capitalize(s) { return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

function buildGrid() {
  const grid = document.getElementById('qGrid');
  grid.innerHTML = '';
  questions.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-dot' + (i===0?' current':'');
    d.id = `dot${i}`;
    d.textContent = i+1;
    d.onclick = () => renderQuestion(i);
    grid.appendChild(d);
  });
}

function renderQuestion(idx) {
  currentIdx = idx;
  const q = questions[idx];
  const letters = ['A','B','C','D'];

  document.getElementById('qNum').textContent  = `Question ${idx+1} of ${questions.length}`;
  document.getElementById('qText').textContent = q.question;

  const optList = document.getElementById('optList');
  optList.innerHTML = '';

  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option' + (answers[idx] === i ? ' selected' : '');
    div.innerHTML = `<div class="option-letter">${letters[i]}</div><span>${opt}</span>`;
    div.onclick = () => selectOption(i);
    optList.appendChild(div);
  });

  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').textContent = idx === questions.length-1 ? 'Review →' : 'Next →';

  updateGrid();
  updateProgress();
}

function selectOption(optIdx) {
  answers[currentIdx] = optIdx;
  renderQuestion(currentIdx);
}

function updateGrid() {
  questions.forEach((_, i) => {
    const d = document.getElementById(`dot${i}`);
    d.className = 'q-dot';
    if (answers[i] !== null) d.classList.add('answered');
    if (i === currentIdx)    d.classList.add('current');
  });
}

function updateProgress() {
  const ans = answers.filter(a=>a!==null).length;
  const total = questions.length;
  document.getElementById('progText').textContent = `${ans} / ${total} answered`;
  document.getElementById('progBar').style.width  = `${(ans/total)*100}%`;
  document.getElementById('ansCount').innerHTML   = `<strong>${ans}</strong> of <strong>${total}</strong> answered`;
}

function prevQ() { if (currentIdx > 0) renderQuestion(currentIdx-1); }
function stepNext() { if (currentIdx < questions.length-1) renderQuestion(currentIdx+1); else showReview(); }

function showReview() {
  document.getElementById('reviewOverlay').style.display = 'flex';
  renderReviewList();
}
function closeReview() {
  document.getElementById('reviewOverlay').style.display = 'none';
}
function renderReviewList() {
  const reviewList = document.getElementById('reviewList');
  const answered = answers.filter(a => a !== null).length;
  const total = questions.length;
  const unanswered = total - answered;
  document.getElementById('reviewCounts').textContent = `Answered ${answered} of ${total} • ${unanswered} unanswered`;
  reviewList.innerHTML = questions.map((q, idx) => {
    const state = answers[idx] !== null ? 'Answered' : 'Unanswered';
    const color = answers[idx] !== null ? 'var(--success)' : 'var(--danger)';
    return `<button class="btn btn-ghost" style="text-align:left;padding:14px;border-radius:16px;width:100%;border:1px solid var(--border);" onclick="renderQuestion(${idx});closeReview();">
      <div style="font-weight:700;color:var(--text);">Q${idx+1}</div>
      <div style="font-size:12px;color:var(--text2);margin-top:6px;">${state}</div>
    </button>`;
  }).join('');
}

// ── Timer ─────────────────────────────────────────────────────
function startTimer() {
  tick();
  timerInterval = setInterval(tick, 1000);
}
function tick() {
  const diff = examEndTime.getTime() - Date.now();
  if (diff <= 0) { clearInterval(timerInterval); autoSubmit(); return; }

  const h = Math.floor(diff/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);

  const tv = document.getElementById('timerVal');
  tv.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
  tv.className   = diff < 300000 ? (diff < 60000 ? 'timer-val crit' : 'timer-val warn') : 'timer-val';
}
function pad(n) { return String(n).padStart(2,'0'); }

// ── Submit ────────────────────────────────────────────────────
function confirmSubmit() {
  const ans = answers.filter(a=>a!==null).length;
  document.getElementById('submitMsg').textContent = `You have answered ${ans} of ${questions.length} questions. Unanswered questions will be marked wrong.`;
  document.getElementById('submitModal').style.display = 'flex';
}
function closeModal() { document.getElementById('submitModal').style.display='none'; }

async function doSubmit() {
  closeModal();
  clearInterval(timerInterval);

  const pin     = await window.examAPI.getSession('pin');
  const timeTaken = Math.round((Date.now() - (examEndTime.getTime() - 3600000)) / 1000);

  const res = await window.examAPI.submitMCQ({
    studentId: student.rollNumber,
    examId: schedule?.id,
    pin, answers, questions,
    timeTaken
  });

  if (res && res.success) {
    await window.examAPI.endExam();
    await window.examAPI.navigate('completed');
  }
}

async function autoSubmit() {
  clearInterval(timerInterval);
  const pin = await window.examAPI.getSession('pin');
  await window.examAPI.submitMCQ({
    studentId: student.rollNumber,
    examId: schedule?.id,
    pin, answers, questions,
    timeTaken: -1
  });
  await window.examAPI.endExam();
  await window.examAPI.navigate('completed');
}

init();
</script>
</body>
</html>
